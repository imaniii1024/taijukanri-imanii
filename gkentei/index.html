<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="G検定 Sprint">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>G検定 Sprint</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">G検定 Sprint</p>
        <h1 id="screenTitle">今日の学習</h1>
      </div>
      <div class="streak" aria-label="連続学習日数">
        <span id="streakDays">0</span>
        <small>days</small>
      </div>
    </header>

    <main>
      <section class="hero-panel">
        <div class="progress-copy">
          <span id="todayCount">0</span><span>/20</span>
          <small>今日の演習</small>
        </div>
        <div class="progress-track" aria-label="今日の演習進捗">
          <div id="todayProgress" class="progress-fill"></div>
        </div>
        <div class="quick-stats">
          <span><b id="accuracyRate">0%</b>正答率</span>
          <span><b id="weakCount">0</b>復習</span>
          <span><b id="masteredCount">0</b>定着</span>
        </div>
      </section>

      <section id="learnView" class="view is-active" aria-labelledby="learnTab">
        <div class="section-head">
          <div>
            <p class="eyebrow">Priority Input</p>
            <h2>重要順インプット</h2>
          </div>
          <button id="markKnownBtn" class="icon-button" type="button" aria-label="理解済みにする">✓</button>
        </div>
        <article id="learnCard" class="learning-card"></article>
        <div class="card-actions">
          <button id="prevCardBtn" class="ghost-button" type="button">前へ</button>
          <button id="quizFromCardBtn" class="primary-button" type="button">この分野を解く</button>
          <button id="nextCardBtn" class="ghost-button" type="button">次へ</button>
        </div>
      </section>

      <section id="quizView" class="view" aria-labelledby="quizTab">
        <div class="section-head">
          <div>
            <p id="quizMeta" class="eyebrow">Weighted Quiz</p>
            <h2>実試験風 4択</h2>
          </div>
          <button id="skipBtn" class="icon-button" type="button" aria-label="スキップ">↷</button>
        </div>
        <article class="quiz-card">
          <div class="question-status">
            <span id="questionPriority" class="pill"></span>
            <span id="questionCategory"></span>
          </div>
          <h3 id="questionText"></h3>
          <div id="choices" class="choices"></div>
          <div id="answerPanel" class="answer-panel" hidden>
            <p id="resultText" class="result-text"></p>
            <p id="explanationText"></p>
            <button id="nextQuestionBtn" class="primary-button wide" type="button">次の問題</button>
          </div>
        </article>
      </section>

      <section id="reviewView" class="view" aria-labelledby="reviewTab">
        <div class="section-head">
          <div>
            <p class="eyebrow">Weak Points</p>
            <h2>間違い復習</h2>
          </div>
          <button id="clearStatsBtn" class="icon-button danger" type="button" aria-label="記録をリセット">×</button>
        </div>
        <div id="reviewList" class="review-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="学習メニュー">
      <button id="learnTab" class="nav-item is-active" type="button" data-view="learnView">
        <span>◎</span>
        <small>インプット</small>
      </button>
      <button id="quizTab" class="nav-item" type="button" data-view="quizView">
        <span>?</span>
        <small>問題</small>
      </button>
      <button id="reviewTab" class="nav-item" type="button" data-view="reviewView">
        <span>!</span>
        <small>復習</small>
      </button>
    </nav>
  </div>

  <script src="./app.js"></script>
</body>
</html>
